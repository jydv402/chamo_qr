on:
  push:
    branches:
      - release

name: Build Chamo QR App

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Flutter clean
        run: flutter clean

      - name: Getting Dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION | cut -d'+' -f2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_full=$VERSION" >> $GITHUB_OUTPUT
          echo "release_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Decode keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "keyAlias=$KEY_ALIAS" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Building signed APK 
        run: |
          flutter build apk --release --dart-define=APP_VERSION=${{ steps.version.outputs.version_name }}
          flutter build apk --release --split-per-abi --dart-define=APP_VERSION=${{ steps.version.outputs.version_name }}

      - name: Rename APK files
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk chamoQR-universal-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk
          mv app-armeabi-v7a-release.apk chamoQR-armeabi-v7a-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk
          mv app-arm64-v8a-release.apk chamoQR-arm64-v8a-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk
          mv app-x86_64-release.apk chamoQR-x86_64-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk

      - name: Upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/chamoQR-universal-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk,build/app/outputs/flutter-apk/chamoQR-armeabi-v7a-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk,build/app/outputs/flutter-apk/chamoQR-arm64-v8a-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk,build/app/outputs/flutter-apk/chamoQR-x86_64-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk"
          tag: ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}
          name: Chamo QR v${{ steps.version.outputs.version_name }}
          body: |
            ### Release Notes
            - Version: ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}
            ---

            ### Which APK file should I download?
            This release includes optimized APK files for different device architectures as well as a universal installer. Please choose the appropriate file for your device:
            
            *   **`chamoQR-arm64-v8a-...apk`**: For almost all modern Android phones and tablets (64-bit ARM devices).
            *   **`chamoQR-armeabi-v7a-...apk`**: For older 32-bit Android phones and tablets.
            *   **`chamoQR-x86_64-...apk`**: For Android Emulators, ChromeOS/Chromebooks, or Intel/AMD-powered Android devices.
            *   **`chamoQR-universal-...apk`**: For all devices (Universal fat APK). Download this if you're unsure or having issues installing arch-specific versions.
            
            ---
            *Note: If you are not sure, try downloading the **`universal`** version first.*
          token: ${{ secrets.CHAMO_QR_TOKEN }}
