Categories:
  - Internet
License: MIT
AuthorName: jdmakes
SourceCode: https://github.com/jydv402/chamo_qr
IssueTracker: https://github.com/jydv402/chamo_qr/issues
Changelog: https://github.com/jydv402/chamo_qr/releases

AutoName: Chamo QR

RepoType: git
Repo: https://github.com/jydv402/chamo_qr

Builds:
  - versionName: 1.0.5
    versionCode: 6
    commit: 1.0.5+6
    gradle:
      - fdroidRelease
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - .vscode
    prebuild:
      - git -C $$flutter$$ checkout -f 3.41.9
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter build apk --release --flavor fdroid --dart-define=IS_FDROID=true

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.5
CurrentVersionCode: 6
