name: chamo_qr_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_ringtone_player: ^4.0.0+4
  get: ^4.7.3
  image_gallery_saver_plus: ^4.0.1
  image_picker: ^1.2.1
  intl: ^0.20.2
  mobile_scanner: ^7.2.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  share_plus: ^13.1.0
  shared_preferences: ^2.5.4
  timeago: ^3.7.1
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  vibration: ^3.1.7
  update_checker_bottom_sheet: ^0.0.5
  flutter_file_dialog: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # package_rename: ^1.10.1
  # flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/chamo_fore.png
    - assets/sounds/
    
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: GSansFlex
      fonts:
        - asset: assets/fonts/GSansFlex-Regular.ttf
          weight: 400
        - asset: assets/fonts/GSansFlex-Medium.ttf
          weight: 500
        - asset: assets/fonts/GSansFlex-SemiBold.ttf
          weight: 600


